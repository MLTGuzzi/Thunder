<form *ngIf="fields.length > 0" [formGroup]="form" (ngSubmit)="onSubmit(model)">
  <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
  <button type="submit" class="btn btn-default" [disabled]="form.invalid">Accept</button>
  <button type="button" class="btn btn-default" (click)="onCancel()">Cancel</button>
</form>
