<!-- filepath: src/app/components/menu/menu.component.html -->
<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()" class="menu-button">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="navbar--title">Twisty Wrenches</span>
  <span class="spacer"></span>
  <span *ngIf="auth.isAuthenticated$ | async">
    <span class="navbar--user">{{ (auth.user$ | async)?.name }}</span>  
  </span>
  <span class="spacer"></span>
  <img src="/TAS_Logo_150.jpg" alt="Logo" class="navbar-logo">
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" class="sidenav">
    <mat-nav-list>
      <a mat-list-item *ngIf="(auth.isAuthenticated$ | async)" routerLink="/dashboard" (click)="sidenav.close()">Dashboard</a>
      <a mat-list-item routerLink="/" (click)="sidenav.close()">About</a>
      <ng-container *ngIf="!(auth.isAuthenticated$ | async); else loggedIn">
        <a mat-list-item (click)="this.loginWithRedirect(); sidenav.close()">Login</a>
      </ng-container>
      <ng-template #loggedIn>
        <a mat-list-item (click)="this.logout(); sidenav.close()">Logout</a>
      </ng-template>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar-row class="navbar">
      <nav>
        <a mat-button *ngIf="(auth.isAuthenticated$ | async)" routerLink="/dashboard">Dashboard</a>
        <a mat-button routerLink="/">About</a>
      </nav>
      <span class="spacer"></span>
      <div>
        <ng-container *ngIf="!(auth.isAuthenticated$ | async); else loggedIn">
          <a mat-button (click)="this.loginWithRedirect()">Login</a>
        </ng-container>
        <ng-template #loggedIn>
          <a mat-button (click)="this.logout()">Logout</a>
        </ng-template>
      </div>
    </mat-toolbar-row>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
