<mat-card>
    <mat-card-title>Work Orders</mat-card-title>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
 
       <!-- Work Order # Column -->
       <ng-container matColumnDef="workOrderNumber">
        <th mat-header-cell *matHeaderCellDef> WO # </th>
        <td mat-cell *matCellDef="let element">
          <a mat-button href="javascript:void(0)" (click)="onWorkOrderClick(element)">
            {{ element.workOrderNumber }}
          </a>
        </td>
      </ng-container>
       
        <!-- Tail # Column -->
        <ng-container matColumnDef="tailNumber">
          <th mat-header-cell *matHeaderCellDef> Tail # </th>
          <td mat-cell *matCellDef="let element">
            <a mat-button href="javascript:void(0)" (click)="onTailNumberClick(element)">
              {{ element.tailNumber }}
            </a>
          </td>
        </ng-container>
  
        <!-- Owner Column (conditionally hidden) -->
        <ng-container matColumnDef="ownerName">
          <th mat-header-cell *matHeaderCellDef class="hide-on-narrow"> Owner </th>
          <td mat-cell *matCellDef="let element" class="hide-on-narrow"> {{ element.ownerName }} </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element"> {{ element.status }} </td>
        </ng-container>
  
        <!-- Work Type Column -->
        <ng-container matColumnDef="workType">
          <th mat-header-cell *matHeaderCellDef> Type </th>
          <td mat-cell *matCellDef="let element"> {{ element.workType }} </td>
        </ng-container>

        <!-- Description Column (conditionally hidden) -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="hide-on-narrow"> Description </th>
          <td mat-cell *matCellDef="let element" class="hide-on-narrow"> {{ element.description }} </td>
        </ng-container>
  
        <!-- Header Row -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  
        <!-- Data Rows -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
